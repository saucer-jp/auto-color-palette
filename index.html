<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="基準色相とOKLCHの彩度・明度カーブからカラーパレットを作成します。"
    />
    <title>自動カラーパレット</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <h1 class="visually-hidden">自動カラーパレット</h1>

      <div class="workspace">
        <aside class="settings-panel" aria-label="パレット設定">
          <div class="panel-heading">
            <div>
              <h2>設定</h2>
            </div>
            <div class="panel-actions">
              <button
                class="panel-action share-trigger"
                id="copy-share-url"
                type="button"
                aria-label="共有URLをコピー"
                title="共有URLをコピー"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M10 13a5 5 0 0 0 7.54.54l1.42-1.42a5 5 0 0 0-7.07-7.07L10.5 6.5" />
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-1.42 1.42a5 5 0 0 0 7.07 7.07L13.5 17.5" />
                </svg>
              </button>
              <button
                class="panel-action export-trigger"
                id="export-palette-button"
                type="button"
                aria-label="JSONをエクスポート"
                aria-haspopup="dialog"
                aria-controls="export-dialog"
                aria-expanded="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 15v3.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V15" />
                </svg>
              </button>
            </div>
          </div>

          <div class="control-stack">
            <div class="settings-section">
              <div class="control-field color-field">
                <div class="field-label-row">
                  <label for="palette-background">パレットの背景色</label>
                  <output id="palette-background-value" for="palette-background">
                    #F9FAF7
                  </output>
                </div>
                <div class="color-control">
                  <input id="palette-background" type="color" value="#f9faf7" />
                </div>
              </div>
            </div>

            <div class="settings-section">
              <div class="control-field">
                <div class="field-label-row">
                  <label for="gap">グリッド間隔</label>
                  <output id="gap-value" for="gap">8px</output>
                </div>
                <input
                  id="gap"
                  class="range-input"
                  type="range"
                  min="0"
                  max="40"
                  step="1"
                  value="8"
                />
              </div>
            </div>

            <div class="settings-section">
              <div class="control-field">
                <div class="field-label-row">
                  <label for="base-hue">基準色相</label>
                  <output id="base-hue-value" for="base-hue">259.8°</output>
                </div>
                <input
                  id="base-hue"
                  class="range-input"
                  type="range"
                  min="0"
                  max="359.9"
                  step="0.1"
                  value="259.8"
                />
              </div>
            </div>

            <div class="settings-section">
              <div class="control-field">
                <div class="field-label-row">
                  <label for="hue-count">色相数</label>
                  <output id="hue-count-value" for="hue-count">12色相</output>
                </div>
                <input
                  id="hue-count"
                  class="range-input"
                  type="range"
                  min="2"
                  max="24"
                  step="1"
                  value="12"
                />
              </div>
            </div>

            <div class="settings-section">
              <div class="control-field">
                <div class="field-label-row">
                  <label for="step-count">カラーステップ数</label>
                  <output id="step-count-value" for="step-count">12ステップ</output>
                </div>
                <input
                  id="step-count"
                  class="range-input"
                  type="range"
                  min="5"
                  max="30"
                  step="1"
                  value="12"
                />
              </div>
            </div>

            <div class="settings-section">
              <div
                class="control-field curve-field"
                id="chroma-curve-field"
                role="group"
                aria-labelledby="chroma-curve-label"
              >
                <div class="field-label-row">
                  <span id="chroma-curve-label">彩度カーブ</span>
                  <output id="chroma-curve-value">OKLCH C</output>
                </div>
                <div
                  class="curve-editor"
                  id="chroma-curve-editor"
                  data-curve="chroma"
                >
                  <svg
                    class="curve-plot"
                    viewBox="0 0 100 100"
                    preserveAspectRatio="none"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <line class="curve-grid-line" x1="0" y1="25" x2="100" y2="25" />
                    <line class="curve-grid-line" x1="0" y1="50" x2="100" y2="50" />
                    <line class="curve-grid-line" x1="0" y1="75" x2="100" y2="75" />
                    <path class="curve-path" id="chroma-curve-path" d="M 0 50 L 50 50 L 100 50" />
                  </svg>
                  <div class="curve-handle-layer">
                    <button
                      class="curve-handle"
                      id="chroma-handle-start"
                      data-point="start"
                      type="button"
                      role="slider"
                      aria-label="彩度カーブの始点"
                      aria-valuemin="0"
                      aria-valuemax="0.4"
                      aria-valuestep="0.001"
                      aria-valuenow="0.188"
                      aria-valuetext="0.188"
                    ></button>
                    <button
                      class="curve-handle"
                      id="chroma-handle-middle"
                      data-point="middle"
                      type="button"
                      role="slider"
                      aria-label="彩度カーブの中点"
                      aria-valuemin="0"
                      aria-valuemax="0.4"
                      aria-valuestep="0.001"
                      aria-valuenow="0.188"
                      aria-valuetext="0.188"
                    ></button>
                    <button
                      class="curve-handle"
                      id="chroma-handle-end"
                      data-point="end"
                      type="button"
                      role="slider"
                      aria-label="彩度カーブの終点"
                      aria-valuemin="0"
                      aria-valuemax="0.4"
                      aria-valuestep="0.001"
                      aria-valuenow="0.188"
                      aria-valuetext="0.188"
                    ></button>
                  </div>
                </div>
                <div class="curve-point-values" aria-label="彩度カーブの制御点">
                  <span>始点 <output id="chroma-curve-start-value">0.188</output></span>
                  <span>中点 <output id="chroma-curve-middle-value">0.188</output></span>
                  <span>終点 <output id="chroma-curve-end-value">0.188</output></span>
                </div>
              </div>
            </div>

            <div class="settings-section">
              <div
                class="control-field curve-field"
                id="lightness-curve-field"
                role="group"
                aria-labelledby="lightness-curve-label"
              >
                <div class="field-label-row">
                  <span id="lightness-curve-label">明度カーブ</span>
                  <output id="lightness-curve-value">OKLCH L</output>
                </div>
                <div
                  class="curve-mode-control"
                  role="group"
                  aria-labelledby="lightness-curve-mode-label"
                >
                  <span class="curve-mode-label" id="lightness-curve-mode-label">
                    カーブの種類
                  </span>
                  <div class="curve-mode-options">
                    <label class="curve-mode-option">
                      <input
                        type="radio"
                        name="lightness-curve-mode"
                        value="custom"
                        checked
                      />
                      <span>カスタム</span>
                    </label>
                    <label class="curve-mode-option">
                      <input
                        type="radio"
                        name="lightness-curve-mode"
                        value="s"
                      />
                      <span>S字カーブ</span>
                    </label>
                  </div>
                </div>
                <div
                  class="curve-editor"
                  id="lightness-curve-editor"
                  data-curve="lightness"
                  data-mode="custom"
                >
                  <svg
                    class="curve-plot"
                    viewBox="0 0 100 100"
                    preserveAspectRatio="none"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <line class="curve-grid-line" x1="0" y1="25" x2="100" y2="25" />
                    <line class="curve-grid-line" x1="0" y1="50" x2="100" y2="50" />
                    <line class="curve-grid-line" x1="0" y1="75" x2="100" y2="75" />
                    <path class="curve-path" id="lightness-curve-path" d="M 0 75 L 50 38 L 100 2" />
                  </svg>
                  <div class="curve-handle-layer">
                    <button
                      class="curve-handle"
                      id="lightness-handle-start"
                      data-point="start"
                      type="button"
                      role="slider"
                      aria-label="明度カーブの始点"
                      aria-valuemin="0"
                      aria-valuemax="1"
                      aria-valuestep="0.001"
                      aria-valuenow="0.263"
                      aria-valuetext="0.263"
                    ></button>
                    <button
                      class="curve-handle"
                      id="lightness-handle-middle"
                      data-point="middle"
                      type="button"
                      role="slider"
                      aria-label="明度カーブの中点"
                      aria-valuemin="0"
                      aria-valuemax="1"
                      aria-valuestep="0.001"
                      aria-valuenow="0.623"
                      aria-valuetext="0.623"
                    ></button>
                    <button
                      class="curve-handle"
                      id="lightness-handle-end"
                      data-point="end"
                      type="button"
                      role="slider"
                      aria-label="明度カーブの終点"
                      aria-valuemin="0"
                      aria-valuemax="1"
                      aria-valuestep="0.001"
                      aria-valuenow="0.983"
                      aria-valuetext="0.983"
                    ></button>
                  </div>
                </div>
                <div class="curve-point-values" aria-label="明度カーブの値">
                  <span>始点 <output id="lightness-curve-start-value">0.263</output></span>
                  <span>中点 <output id="lightness-curve-middle-value">0.623</output></span>
                  <span>終点 <output id="lightness-curve-end-value">0.983</output></span>
                </div>
                <div class="curve-s-controls" id="lightness-s-curve-controls" hidden>
                  <div class="curve-bound">
                    <div class="field-label-row">
                      <label for="lightness-s-amount">S字の強さ</label>
                      <output id="lightness-s-amount-value" for="lightness-s-amount">+70%</output>
                    </div>
                    <input
                      id="lightness-s-amount"
                      class="range-input"
                      type="range"
                      min="-1"
                      max="1"
                      step="0.01"
                      value="0.7"
                    />
                  </div>
                </div>
              </div>
            </div>

            <div class="settings-section">
              <div class="control-field">
                <label class="checkbox-control" for="show-gamut-warnings">
                  <input id="show-gamut-warnings" type="checkbox" checked />
                  <span>
                    色域外の警告ドットを表示
                    <span
                      class="gamut-warning-count"
                      id="gamut-warning-count"
                      aria-live="polite"
                    >(0)</span>
                  </span>
                </label>
              </div>
            </div>

            <div class="settings-danger-zone">
              <button
                class="reset-button"
                id="reset-button"
                type="button"
              >
                <span aria-hidden="true">↺</span>
                <span>設定を初期値に戻す</span>
              </button>
            </div>
          </div>
        </aside>

        <section class="preview-panel" aria-label="カラーパレットプレビュー">
          <div
            class="compatibility-note"
            id="compatibility-note"
            role="status"
            aria-live="polite"
            hidden
          ></div>

          <div class="palette-frame">
            <div
              class="palette-grid"
              id="palette-grid"
              aria-label="生成されたカラーパレット"
            ></div>
          </div>

        </section>
      </div>
    </main>

    <dialog
      class="export-dialog"
      id="export-dialog"
      closedby="any"
      aria-labelledby="export-dialog-title"
      aria-describedby="export-dialog-description"
    >
      <div class="export-dialog-content">
        <div class="export-dialog-header">
          <div>
            <h2 id="export-dialog-title">エクスポート</h2>
          </div>
          <form method="dialog">
            <button
              class="dialog-close-button"
              type="submit"
              aria-label="JSONエクスポートを閉じる"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
          </form>
        </div>
        <p class="export-dialog-description" id="export-dialog-description">
          パレットを色相ごとのグループに分けてJSONで表示しています。
        </p>
        <pre
          class="export-json-preview"
          id="export-json-preview"
          tabindex="0"
          aria-label="JSONプレビュー"
        ><code id="export-json-code"></code></pre>
        <div class="export-copy-row">
          <p class="export-copy-hint">
            JSON内を選択している場合は選択範囲だけを、選択がない場合はJSON全体をコピーします。
          </p>
          <div class="export-dialog-actions">
            <button class="export-copy-button" id="export-copy-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="8" y="8" width="11" height="11" rx="2" />
                <path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8" />
              </svg>
              <span id="export-copy-label">クリップボードにコピー</span>
            </button>
          </div>
        </div>
      </div>
    </dialog>

    <div class="toast-container" aria-live="polite">
      <div
        class="toast"
        id="toast"
        popover="manual"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <span id="toast-message"></span>
        <button
          class="toast-close"
          type="button"
          aria-label="通知を閉じる"
          popovertarget="toast"
          popovertargetaction="hide"
        >
          ×
        </button>
      </div>
    </div>

    <noscript>
      <p class="noscript-message">
        このアプリを利用するにはJavaScriptを有効にしてください。
      </p>
    </noscript>
  </body>
</html>
